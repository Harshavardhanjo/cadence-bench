name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Timer and clock behaviour is a property of the OS and the Go runtime, not
    # of this code, so the suite has to run on all three. The timing tests
    # assert the shape of the error rather than wall-clock figures precisely so
    # that they can.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: go build ./...

  probe:
    # Publishes each runner's clock resolution and sleep granularity into the
    # job log. These are the figures that decide whether a host can measure a
    # 20ms cadence at all, they differ sharply between operating systems and Go
    # versions, and a hosted runner is a more honest source for them than any
    # single development machine.
    needs: test

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: characterise the host
        run: go run ./cmd/cadence probe -samples 200 -period 20ms

      - name: measure at a 20ms period
        # Deliberately not forced, and deliberately not fatal.
        #
        # A runner whose clock cannot resolve a 20ms period makes this step exit
        # non-zero, which is the harness working correctly rather than a broken
        # build: the Windows runner's monotonic clock advances in ~0.7ms steps
        # and is expected to refuse. Failing the job over it would report a
        # platform limit as a defect in this repository, so the step is allowed
        # to fail and the log carries the reason.
        continue-on-error: true
        run: >
          go run ./cmd/cadence run
          -period 20ms -work 2ms -ticks 150 -warmup 30 -reps 3
          -scenarios idle,cpu-contention
